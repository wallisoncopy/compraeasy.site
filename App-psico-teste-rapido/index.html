    <script src="app.js"></script>

<!-- BANNER 100 MAPAS MENTAIS (oferta para clientes do app) -->
<script>
(function () {
  var KEY = 'oferta_mapas_v1';
  function ler() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
  function salvar(o) { try { var s = ler(); for (var k in o) s[k] = o[k]; localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  function dias(t) { return t ? (Date.now() - t) / 864e5 : Infinity; }
  function oculto() { var s = ler(); return dias(s.fechado) < 7 || dias(s.clicou) < 30; }
  window.mapasBanner = function (alvo, antes) {
    if (!alvo || oculto() || document.getElementById('banner-mapas')) return;
    var d = document.createElement('div');
    d.id = 'banner-mapas';
    d.style.cssText = 'position:relative;margin:16px 0;border-radius:16px;overflow:hidden;border:1px solid #a7f3d0;background:linear-gradient(135deg,#ecfdf5,#fff);box-shadow:0 4px 14px rgba(0,0,0,.08);font-family:inherit';
    d.innerHTML =
      '<button aria-label="Fechar" style="position:absolute;top:6px;right:6px;width:28px;height:28px;border:0;border-radius:50%;background:rgba(255,255,255,.85);color:#9ca3af;font-size:18px;line-height:1;cursor:pointer;z-index:2">&times;</button>' +
      '<a href="https://compraeasy.site/mapasmentaispsicopedagogia/?utm_source=apppsico&utm_medium=banner&utm_content=banner-home" target="_blank" rel="noopener" style="display:flex;gap:12px;align-items:center;padding:12px 16px 12px 12px;text-decoration:none">' +
        '<img src="https://compraeasy.site/mapasmentaispsicopedagogia/img/hero.webp" alt="100 Mapas Mentais de Psicopedagogia" loading="lazy" onerror="this.style.display=\'none\'" style="width:104px;height:auto;flex-shrink:0;border-radius:8px">' +
        '<div style="flex:1;min-width:0">' +
          '<span style="display:inline-block;background:#fcd34d;color:#064e3b;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;margin-bottom:4px">COMPLEMENTO DO SEU APP</span>' +
          '<p style="margin:0;font-weight:800;color:#1f2937;font-size:15px;line-height:1.2">100 Mapas Mentais de Psicopedagogia</p>' +
          '<p style="margin:4px 0 0;font-size:12px;color:#6b7280;line-height:1.35">Cada tema da psicopedagogia em uma única página. Em PDF, para estudar e consultar.</p>' +
          '<span style="display:inline-block;margin-top:8px;background:#059669;color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px">Ver os mapas &rarr;</span>' +
        '</div></a>';
    d.querySelector('button').onclick = function (e) { e.preventDefault(); salvar({ fechado: Date.now() }); d.remove(); };
    d.querySelector('a').onclick = function () { salvar({ clicou: Date.now() }); setTimeout(function () { d.remove(); }, 500); };
    if (antes) alvo.insertBefore(d, antes); else alvo.appendChild(d);
  };
})();
</script>
<script>
(function () {
  if (typeof router === 'undefined' || !router.render) return;
  var r = router.render.bind(router);
  router.render = function () {
    r();
    if (typeof AppState !== 'undefined' && AppState.currentView === 'home') {
      var c = document.querySelector('#app-content > .space-y-6') || document.getElementById('app-content');
      mapasBanner(c, null);
    }
  };
  if (typeof AppState !== 'undefined' && AppState.currentView === 'home') router.render();
})();
</script>
    <script>
        // Service Worker Simples para funcionamento Offline
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
            });
        }
        // Detector de conexão
        window.addEventListener('online', () => document.getElementById('status-badge').innerText = 'Online');
        window.addEventListener('offline', () => document.getElementById('status-badge').innerText = 'Offline');
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
