<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fala em Casa">
<meta name="theme-color" content="#fff7ef">
<title>Fala em Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#fff7ef; --card:#ffffff; --ink:#2d2118; --muted:#7c6a5b; --line:#f1e4d6;
  --pri:#f26b3a; --pri-d:#d9541f; --pri-l:#ffe6d9; --teal:#0f9d8a; --teal-l:#d7f5ef;
  --yel:#ffd34d; --lock:#b9a99a; --r:20px; --shadow:0 6px 20px rgba(120,70,30,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.45;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.screen{display:none;animation:fade .25s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:26px;font-weight:900;line-height:1.15}
h2{font-size:21px;font-weight:900;line-height:1.2}
h3{font-size:17px;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.gap>*+*{margin-top:14px}
.btn{text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px 18px;border-radius:16px;font-weight:800;font-size:17px;background:var(--pri);color:#fff;box-shadow:0 6px 0 var(--pri-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--pri-d)}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.teal{background:var(--teal);box-shadow:0 6px 0 #0a7a6b}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-weight:800;font-size:13px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:20px;display:grid;place-items:center;flex:none}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px}
.logo b{background:var(--pri);color:#fff;border-radius:10px;width:32px;height:32px;display:grid;place-items:center;font-size:18px}

/* quiz */
.qbar{height:8px;background:#f3e3d3;border-radius:9px;overflow:hidden;margin:6px 0 22px}
.qbar i{display:block;height:100%;background:var(--pri);border-radius:9px;transition:width .3s}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;border-radius:16px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:16px;margin-top:10px}
.opt .e{font-size:24px;flex:none}
.opt.sel{border-color:var(--pri);background:var(--pri-l)}
.field{width:100%;padding:15px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;outline:none}
.field:focus{border-color:var(--pri)}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* home */
.hello{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.today{background:linear-gradient(145deg,var(--pri),#ff9152);color:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 26px rgba(242,107,58,.35);position:relative;overflow:hidden}
.today:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.today .lbl{font-weight:800;font-size:13px;opacity:.9;text-transform:uppercase;letter-spacing:.5px}
.today h2{color:#fff;margin:6px 0 4px;font-size:24px}
.today .btn{background:#fff;color:var(--pri-d);box-shadow:0 5px 0 rgba(0,0,0,.12);margin-top:14px}
.days{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:10px}
.days span{aspect-ratio:1;border-radius:7px;background:#f3e3d3;display:grid;place-items:center;font-size:10px;font-weight:800;color:#b49a85}
.days span.ok{background:var(--teal);color:#fff}
.days span.cur{background:var(--pri);color:#fff;box-shadow:0 0 0 3px var(--pri-l)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;box-shadow:var(--shadow);position:relative}
.tile .e{font-size:30px;display:block;margin-bottom:6px}
.tile b{display:block;font-weight:900;font-size:16px}
.tile small{color:var(--muted);font-size:13px;font-weight:600}
.tile .lk{position:absolute;top:10px;right:12px;font-size:14px}

/* missão */
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border:0}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--pri-l);color:var(--pri-d);font-weight:900;display:grid;place-items:center;flex:none;font-size:14px}
.say{background:var(--teal-l);border-radius:18px 18px 18px 4px;padding:12px 14px;font-weight:700;margin-top:8px;color:#0b5c50}
.tip{background:#fff6d6;border:1px solid #ffe591;border-radius:16px;padding:14px}
.win{background:#e9f9ee;border:1px solid #bfeccc;border-radius:16px;padding:14px}
.rep{background:#f4ecff;border:1px solid #e1d1ff;border-radius:16px;padding:12px 14px;font-weight:700;color:#5b2fb0;font-size:15px}
.listm{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:16px;margin-top:10px;width:100%;text-align:left}
.listm .d{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:900;flex:none;color:#fff}

/* cartões */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 12px;text-align:center;box-shadow:var(--shadow)}
.cat .e{font-size:40px;display:block}
.cat b{display:block;margin-top:6px;font-weight:900}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.fc{background:#fff;border:3px solid var(--line);border-radius:22px;padding:14px 8px 12px;text-align:center;box-shadow:var(--shadow);transition:transform .12s}
.fc .e{font-size:64px;line-height:1.1;display:block}
.fc b{display:block;font-size:20px;font-weight:900;margin-top:6px;text-transform:uppercase;letter-spacing:.5px}
.fc small{color:var(--muted);font-weight:700}
.fc.play{transform:scale(1.06);border-color:var(--pri)}
.toggle{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:700}
.sw{width:50px;height:30px;border-radius:99px;background:#e6d7c8;position:relative;transition:.2s;flex:none}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--teal)}
.sw.on:after{left:23px}

/* diário */
.big{font-size:44px;font-weight:900;color:var(--pri);line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
.chip small{color:var(--muted);font-weight:700;font-size:11px}
.chip button{color:#c9a58a;font-size:16px;line-height:1}
canvas{max-width:100%}

/* marcos */
.acc{background:#fff;border:1px solid var(--line);border-radius:18px;margin-top:10px;overflow:hidden}
.acc>button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px;font-weight:900;font-size:16px;text-align:left}
.acc .body{display:none;padding:0 16px 12px}
.acc.open .body{display:block}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line);font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--teal);flex:none;margin-top:1px}
.alert{background:#fff1ee;border:1px solid #ffd0c4;border-radius:16px;padding:14px}
.alert li{margin:6px 0 0 18px}

/* lock */
.lockbox{text-align:center;padding:26px 18px}
.lockbox .e{font-size:44px}
.upg{background:linear-gradient(145deg,#2d2118,#4b3526);color:#fff;border-radius:22px;padding:20px}
.upg .btn{background:var(--yel);color:#2d2118;box-shadow:0 5px 0 #d9ac1c;margin-top:12px}
.upg li{margin:6px 0 0 4px;list-style:none}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
nav .in{display:flex;max-width:520px;width:100%}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:#a8968a;padding:4px 0}
nav button .e{font-size:22px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--pri)}
nav button.on .e{filter:none;opacity:1}
nav.hide{display:none}

/* celebração */
.cele{position:fixed;inset:0;background:rgba(45,33,24,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
.cele.on{display:flex}
.cele .box{background:#fff;border-radius:26px;padding:26px 22px;text-align:center;max-width:380px;width:100%;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.cele .e{font-size:64px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.disc{font-size:12.5px;color:var(--muted);text-align:center;margin-top:18px}
</style>
</head>
<body>

<!-- ============ QUIZ ============ -->
<section id="s-acesso" class="screen"><div class="wrap gap" id="acessobox"></div></section>

<section id="s-quiz" class="screen">
  <div class="wrap">
    <div class="logo"><b>🗣️</b>Fala em Casa</div>
    <div class="qbar"><i id="qfill" style="width:0"></i></div>
    <div id="qbox"></div>
  </div>
</section>

<!-- ============ RESULTADO ============ -->
<section id="s-res" class="screen"><div class="wrap gap" id="resbox"></div></section>

<!-- ============ INÍCIO ============ -->
<section id="s-home" class="screen"><div class="wrap gap" id="homebox"></div></section>

<!-- ============ MISSÃO ============ -->
<section id="s-mis" class="screen"><div class="wrap gap" id="misbox"></div></section>

<!-- ============ BRINCADEIRAS ============ -->
<section id="s-lista" class="screen"><div class="wrap" id="listabox"></div></section>

<!-- ============ CARTÕES ============ -->
<section id="s-cart" class="screen"><div class="wrap" id="cartbox"></div></section>

<!-- ============ DIÁRIO ============ -->
<section id="s-diario" class="screen"><div class="wrap gap" id="diariobox"></div></section>

<!-- ============ MARCOS ============ -->
<section id="s-marcos" class="screen"><div class="wrap" id="marcosbox"></div></section>

<!-- ============ GUIAS ============ -->
<section id="s-guias" class="screen"><div class="wrap" id="guiasbox"></div></section>

<!-- ============ RELATÓRIO ============ -->
<section id="s-rel" class="screen"><div class="wrap gap" id="relbox"></div></section>

<!-- ============ IMPRIMIR ============ -->
<section id="s-imp" class="screen"><div class="wrap gap" id="impbox"></div></section>

<!-- ============ MAIS ============ -->
<section id="s-mais" class="screen"><div class="wrap gap" id="maisbox"></div></section>

<nav id="nav" class="hide"><div class="in">
  <button data-go="home"><span class="e">🏠</span>Início</button>
  <button data-go="lista"><span class="e">🎲</span>Brincadeiras</button>
  <button data-go="cart"><span class="e">🃏</span>Cartões</button>
  <button data-go="diario"><span class="e">📒</span>Diário</button>
  <button data-go="mais"><span class="e">☰</span>Mais</button>
</div></nav>

<div class="cele" id="cele"><div class="box gap" id="celebox"></div></div>
<div class="toast" id="toast"></div>

<script>
// Conteúdo do app Fala em Casa — fases, brincadeiras (com roteiro do que falar), cartões, marcos, guias.
// Linguagem: simples, para mães e pais. Nada de promessa de resultado nem diagnóstico.

const FASES = [
  { id: 1, nome: "Primeiros Sons", cor: "#f97316", emoji: "🍼",
    resumo: "Seu filho ainda não usa palavras. Agora o foco é atenção, imitação e sons — a base de toda fala.",
    objetivo: "Olhar junto, imitar gestos e sons, e entender que a comunicação traz coisas boas." },
  { id: 2, nome: "Primeiras Palavras", cor: "#eab308", emoji: "🌱",
    resumo: "Seu filho já fala algumas palavras. Agora o foco é criar vontade e oportunidade de falar mais.",
    objetivo: "Usar palavras para pedir, chamar e mostrar — em vez de chorar ou puxar pela mão." },
  { id: 3, nome: "Mais Palavras", cor: "#22c55e", emoji: "🌿",
    resumo: "Seu filho já fala várias palavras soltas. Agora o foco é aumentar o vocabulário: coisas, ações e pessoas.",
    objetivo: "Aprender palavras novas toda semana, incluindo ações (come, pula) e lugares (em cima, embaixo)." },
  { id: 4, nome: "Juntando Palavras", cor: "#0ea5e9", emoji: "🧩",
    resumo: "Seu filho já junta duas palavras. Agora o foco é transformar isso em frases curtas.",
    objetivo: "Combinar palavras: “mais suco”, “carro azul”, “papai dormiu”, “cadê bola?”." },
  { id: 5, nome: "Frases e Conversas", cor: "#8b5cf6", emoji: "💬",
    resumo: "Seu filho já fala frases. Agora o foco é conversar, contar o que aconteceu e falar cada vez mais claro.",
    objetivo: "Contar acontecimentos, explicar o porquê, seguir uma história e brincar com os sons." },
];

// Cada brincadeira: t=título, min=minutos, mat=materiais, passos, falar=roteiro (frases prontas), dica, comemore
const MISSOES = {
1: [
 { t: "Cadê? Achou!", min: 10, mat: "Um paninho ou fralda",
   passos: ["Sente de frente para a criança, na altura dos olhos dela.", "Cubra o seu rosto com o pano e espere 2 segundos.", "Tire o pano com animação e sorria.", "Depois, cubra um brinquedo e deixe ela descobrir."],
   falar: ["“Cadê a mamãe? … ACHOU!”", "“Cadê o urso? Sumiu! … Achou o urso!”", "“De novo? Vamos de novo!”"],
   dica: "Antes de tirar o pano, faça uma pausa curta. A expectativa faz a criança olhar para você e tentar participar.",
   comemore: "Se ela puxar o pano, sorrir ou fizer qualquer som pedindo “de novo”." },
 { t: "Espelho das caretas", min: 8, mat: "Um espelho (ou a câmera frontal do celular)",
   passos: ["Fiquem os dois de frente para o espelho.", "Faça uma careta simples: boca aberta, beijo, língua para fora.", "Espere e veja se ela tenta copiar.", "Copie você também qualquer careta ou som que ela fizer."],
   falar: ["“Olha a boca da mamãe: AAAA!”", "“Beijo! Muá!”", "“Cadê a língua? Olha a língua!”"],
   dica: "Imitar a criança é tão importante quanto ela imitar você: quando você copia, ela percebe que o que faz tem efeito.",
   comemore: "Qualquer tentativa de copiar um movimento da boca já é uma vitória." },
 { t: "Bichos que falam", min: 10, mat: "Bichinhos de brinquedo ou figuras (ou os cartões do app)",
   passos: ["Mostre um bichinho de cada vez, perto do seu rosto.", "Faça o som do bicho de forma bem exagerada.", "Faça o bicho “andar” até a criança.", "Repita o mesmo bicho várias vezes antes de trocar."],
   falar: ["“O cachorro faz… AU AU!”", "“O gato faz… MIAU!”", "“A vaca faz… MUUU!”"],
   dica: "Sons de bichos são mais fáceis que palavras. Muitas crianças falam “au au” antes de “cachorro” — e isso conta!",
   comemore: "Se ela tentar qualquer som de bicho, mesmo diferente do certo." },
 { t: "Bolhas de sabão", min: 8, mat: "Bolhas de sabão (água + detergente + canudo serve)",
   passos: ["Faça algumas bolhas e deixe a criança se divertir.", "Pare, feche o pote e espere olhando para ela.", "Quando ela olhar, apontar ou fizer um som, faça mais bolhas na hora.", "Repita a pausa várias vezes."],
   falar: ["“Mais? Quer MAIS?”", "“Pou! Estourou!”", "“Acabou… quer mais?”"],
   dica: "A pausa é o segredo. Conte até 5 em silêncio, com cara de expectativa. Não entregue antes de ela tentar se comunicar.",
   comemore: "Um olhar, um gesto, um som ou “mais” — tudo isso é pedir, e pedir é comunicar." },
 { t: "Música com pausa", min: 8, mat: "Só a sua voz",
   passos: ["Escolha uma música que a criança conhece.", "Cante algumas vezes inteira, com gestos.", "Depois cante e PARE antes da última palavra.", "Espere ela completar com som, palavra ou gesto."],
   falar: ["“Atirei o pau no ga… (pausa)”", "“O sapo não lava o … (pausa)”", "“Parabéns pra … (pausa)”"],
   dica: "Use sempre as mesmas 2 ou 3 músicas. A repetição é o que permite a criança completar.",
   comemore: "Se ela fizer qualquer som na hora da pausa ou o gesto da música." },
 { t: "Tchau, palma e jóinha", min: 6, mat: "Nenhum",
   passos: ["Use gestos sempre nas mesmas situações do dia.", "Tchau quando alguém sai, palma quando algo dá certo.", "Pegue a mãozinha dela com carinho e ajude a fazer o gesto.", "Aos poucos, ajude cada vez menos."],
   falar: ["“Tchau, papai! Tchau!”", "“Eeee! Bate palma!”", "“Deu certo? Jóinha!”"],
   dica: "Gestos são a ponte para as palavras. Criança que usa gestos costuma ter mais facilidade para falar depois.",
   comemore: "Quando ela fizer o gesto sozinha, sem ajuda." },
 { t: "Narrador do banho", min: 10, mat: "A hora do banho",
   passos: ["Durante o banho, conte em voz alta o que está acontecendo.", "Use frases bem curtas, de 2 ou 3 palavras.", "Fale o que ELA está fazendo ou olhando.", "Repita as mesmas palavras todo dia."],
   falar: ["“Água! Molha o pé.”", "“Lava a barriga. Esfrega, esfrega!”", "“Splash! Água caiu!”"],
   dica: "Fale pouco e devagar, sobre o que ela está prestando atenção. Frases longas ela ainda não consegue acompanhar.",
   comemore: "Se ela olhar para você quando você fala ou fizer sons durante o banho." },
 { t: "Carrinho vrum vrum", min: 8, mat: "Carrinho, bola ou qualquer brinquedo que role",
   passos: ["Empurre o carrinho para ela fazendo o som.", "Deixe ela empurrar de volta para você.", "Toda vez, faça o mesmo som.", "Antes de empurrar, faça “pronto… e…” e espere."],
   falar: ["“Vrum vruuum!”", "“Pronto… e… JÁ!”", "“Bum! Bateu!”"],
   dica: "Brincadeira de vai e volta ensina a “vez de cada um” — que é a base de uma conversa.",
   comemore: "Se ela devolver o carrinho ou fizer o som junto." },
 { t: "Assopra, assopra", min: 6, mat: "Algodão, papel picado ou canudinho com água",
   passos: ["Coloque um pedacinho de algodão na mesa.", "Assopre mostrando como faz, com bochecha cheia.", "Convide a criança a assoprar também.", "No copo, assopre pelo canudo para fazer bolhas."],
   falar: ["“Fuuu! Voou!”", "“Agora você: fuuuu!”", "“Olha as bolhas: blub blub!”"],
   dica: "Brincadeiras de sopro trabalham os músculos e o controle do ar que a fala usa.",
   comemore: "Qualquer sopro, mesmo fraquinho." },
 { t: "Me dá / toma", min: 8, mat: "Bola ou brinquedo preferido",
   passos: ["Segure o brinquedo e estenda a mão pedindo.", "Quando ela der, agradeça com alegria.", "Devolva dizendo “toma”.", "Troquem várias vezes."],
   falar: ["“Me dá? Obrigada!”", "“Toma! É seu!”", "“Minha vez… sua vez!”"],
   dica: "Essa troca simples ensina a ideia de “eu e você” na comunicação.",
   comemore: "Quando ela estender o brinquedo ou a mão sozinha." },
],
2: [
 { t: "Pote das surpresas", min: 10, mat: "Um pote ou caixa + 5 objetos da casa (colher, meia, bola, carrinho, copo)",
   passos: ["Coloque os objetos dentro do pote, sem ela ver.", "Tire um de cada vez, com suspense.", "Diga o nome do objeto 3 vezes, de forma divertida.", "Deixe ela tirar o próximo."],
   falar: ["“O que tem aqui dentro? … BOLA!”", "“Bola! A bola rola. Bola!”", "“Agora você tira!”"],
   dica: "Repetir o nome 3 vezes de jeitos diferentes ajuda a palavra a “grudar”.",
   comemore: "Se ela tentar dizer o nome de qualquer objeto, mesmo pela metade (“bo” para bola)." },
 { t: "Escolha difícil", min: 5, mat: "Duas opções que ela goste (dois lanches, dois brinquedos)",

 { t: "Tudo tem nome na cozinha", min: 10, mat: "A cozinha, na hora de preparar uma refeição",

 { t: "Mais, acabou, abre", min: 8, mat: "Lanche em pedacinhos, pote com tampa",

 { t: "Livro: cadê o…?", min: 10, mat: "Um livro com figuras grandes (ou os cartões do app)",
   passos: ["Sente com a criança no colo.", "Não leia o texto: aponte e nomeie as figuras.", "Pergunte “cadê o…?” e espere ela apontar.", "Depois aponte e pergunte “o que é isso?”."],

 { t: "Boneca com fome", min: 10, mat: "Boneca ou bichinho de pelúcia, colher, prato",

 { t: "Alô, quem é?", min: 6, mat: "Telefone de brinquedo ou um celular desligado",
   passos: ["Finja que o telefone está tocando: “trim trim!”.", "Atenda animada e passe para a criança.", "Diga quem está ligando (vovó, papai).", "Ajude a dizer “alô” e “tchau”."],

 { t: "Caixa fechada", min: 6, mat: "Brinquedo favorito dentro de um pote transparente bem fechado",
   passos: ["Coloque o brinquedo no pote e feche bem.", "Entregue para a criança.", "Quando ela pedir ajuda (mesmo com gesto), espere um pouco.", "Diga a palavra e abra."],

 { t: "Cabeça, ombro, joelho e pé", min: 6, mat: "Só vocês dois",

 { t: "Passeio narrado", min: 10, mat: "Um passeio na rua, no quintal ou na janela",

],

4: [
 { t: "Palavra + 1", min: 10, mat: "Qualquer brincadeira que ela goste",

 { t: "Quem faz o quê?", min: 10, mat: "Bonecos, bichinhos ou pessoas da casa",

 { t: "Cozinha de faz de conta", min: 12, mat: "Panelinha, colher, “ingredientes” (massinha, papel, blocos)",

function delP(i) { if (!confirm("Apagar esta palavra?")) return; S.palavras.splice(i, 1); save(); R.diario(); }
function grafico(cv, P) {
  const ctx = cv.getContext("2d"), W = cv.width, H = cv.height, pad = 60;
  ctx.clearRect(0, 0, W, H); ctx.font = "bold 24px Nunito, sans-serif";
  if (!P.length) { ctx.fillStyle = "#b49a85"; ctx.textAlign = "center"; ctx.fillText("O gráfico aparece quando você registrar palavras", W / 2, H / 2); return; }
  const porDia = {}; P.forEach((x) => porDia[x.d] = (porDia[x.d] || 0) + 1);
  const dias = Object.keys(porDia).sort(); let acc = 0; const pts = dias.map((d) => ({ d, v: (acc += porDia[d]) }));
  if (pts.length === 1) pts.unshift({ d: "", v: 0 });
  const max = Math.max(4, Math.ceil(acc / 4) * 4), n = pts.length;
  ctx.strokeStyle = "#f1e4d6"; ctx.lineWidth = 2; ctx.fillStyle = "#b49a85"; ctx.textAlign = "right";
  for (let i = 0; i <= 4; i++) { const y = H - pad - (i / 4) * (H - pad * 1.6); ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - 20, y); ctx.stroke(); ctx.fillText(Math.round((i / 4) * max), pad - 10, y + 8); }
  const X = (i) => pad + (n === 1 ? 0 : (i / (n - 1)) * (W - pad - 40)), Y = (v) => H - pad - (v / max) * (H - pad * 1.6);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "rgba(242,107,58,.35)"); g.addColorStop(1, "rgba(242,107,58,0)");
  ctx.beginPath(); ctx.moveTo(X(0), H - pad); pts.forEach((p, i) => ctx.lineTo(X(i), Y(p.v))); ctx.lineTo(X(n - 1), H - pad); ctx.fillStyle = g; ctx.fill();
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(X(i), Y(p.v)) : ctx.moveTo(X(i), Y(p.v))); ctx.strokeStyle = "#f26b3a"; ctx.lineWidth = 6; ctx.lineJoin = "round"; ctx.stroke();
  pts.forEach((p, i) => { ctx.beginPath(); ctx.arc(X(i), Y(p.v), 8, 0, 7); ctx.fillStyle = "#fff"; ctx.fill(); ctx.lineWidth = 5; ctx.stroke(); });
  ctx.fillStyle = "#7c6a5b"; ctx.textAlign = "center"; const step = Math.ceil(n / 6);
  pts.forEach((p, i) => { if (p.d && (i % step === 0 || i === n - 1)) ctx.fillText(fmt(p.d), X(i), H - 18); });
}

function semEmoji(s) { return String(s).replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, "").replace(/[“”]/g, '"').trim(); }
function gerarPDF() {

  const titulo = (t) => { y += 4; garante(12); doc.setFillColor(255, 230, 217); doc.roundedRect(M, y - 5, W - M * 2, 9, 2, 2, "F"); txt(t, 12, "bold", [217, 84, 31]); y += 1.5; };
  doc.setFillColor(242, 107, 58); doc.rect(0, 0, W, 30, "F");
  doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(18); doc.text("Relatório de acompanhamento da fala", M, 14);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10.5); doc.text(`Fala em Casa  ·  gerado em ${new Date().toLocaleDateString("pt-BR")}`, M, 22);
  y = 40; const f = fase();
  titulo("Dados da criança");
  txt(`Nome: ${nome()}`); txt(`Idade: ${idadeTxt()} (na avaliação de ${new Date((S.avaliadoEm || hoje()) + "T12:00").toLocaleDateString("pt-BR")})`);
  txt(`Fase atual no app: ${f.id} de 5 - ${f.nome}`); txt(f.resumo, 10, "normal", [124, 106, 91]);
  const r = S.resp || {}; const map = { sim: "sim", as: "às vezes", rar: "raramente", nao: "não", todos: "quase todo mundo", familia: "só a família", ninguem: "quase ninguém", pouco: "menos de 1h", medio: "1 a 2h", muito: "mais de 2h" };
  titulo("Respostas da avaliação inicial (relatadas pela família)");
  const comTxt = ["", "ainda não fala palavras", "fala de 1 a 10 palavras", "fala mais de 10 palavras soltas", "junta 2 palavras", "fala frases"][r.com || 1];
  [["Comunicação", comTxt], ["Olha quando chamado pelo nome", map[r.nomeR]], ["Aponta para pedir/mostrar", map[r.aponta]], ["Entende pedidos simples sem gestos", map[r.comp]], ["Imita sons e gestos", map[r.imita]], ["Perdeu habilidades que já tinha", map[r.regr]], r.intel ? ["Quem entende a fala", map[r.intel]] : null, ["Tempo de tela por dia", map[r.tela]]].filter(Boolean).forEach(([a, b]) => txt(`- ${a}: ${b || "-"}`));
  if (S.alertas?.length) { titulo("Pontos de atenção"); S.alertas.forEach((a) => txt("- " + ALERTAS_TEXTO[a], 10.5, "normal", [180, 50, 30])); }
  const P = S.palavras || [];
  titulo(`Palavras registradas (${P.length})`);
  if (P.length) { txt(P.map((x) => `${x.p} (${fmt(x.d)})`).join(",  ")); } else txt("Nenhuma palavra registrada no diário.", 10.5, "italic", [124, 106, 91]);
  titulo("Marcos da fala");
  const mk = S.marcos || {}; let algum = false;
  MARCOS.filter((g) => g.meses <= Math.max(12, idadeMeses()) + 12).forEach((g) => { txt(g.idade, 11, "bold"); g.itens.forEach((t, i) => { const k = g.meses + "_" + i; algum = true; txt(`${mk[k] ? "[x]" : "[  ]"} ${t}`, 10); }); y += 1; });
  if (!algum) txt("Nenhum marco marcado.", 10.5, "italic");
  const F = S.feitas || {}; const dias = Object.keys(F).map(Number).sort((a, b) => a - b);
  titulo(`Brincadeiras realizadas (${dias.length} de 30)`);
  if (dias.length) { const lista = MISSOES[S.fase] || []; txt(dias.map((d) => `Dia ${d}: ${lista[(d - 1) % lista.length].t} (${fmt(F[d])})`).join("   ·   "), 10); } else txt("Nenhuma brincadeira marcada como feita.", 10.5, "italic");
  titulo("Observações da família"); txt(S.obs?.trim() || "-");
  y += 6; txt("Este relatório foi preenchido pela família no app Fala em Casa e serve como apoio para a conversa com o profissional. Não é um laudo nem um diagnóstico.", 9, "italic", [124, 106, 91]);
  doc.save(`relatorio-fala-${(nome() || "crianca").toLowerCase().replace(/[^a-z0-9]+/gi, "-")}.pdf`);
  toast("PDF gerado! 📄");
}

// ---------- IMPRIMIR CARTÕES ----------
R.imp = () => {
  if (!COMPLETO) { $("#impbox").innerHTML = lockScreen("Cartões para imprimir", "🖨️", "Imprima os cartões de figuras para brincar longe da tela: jogo da memória, caça aos cartões e muito mais."); return; }
  $("#impbox").innerHTML = `${topbar("Cartões para imprimir")}
  <div class="card gap"><p>Escolha as categorias. Cada folha A4 traz 6 cartões grandes para recortar.</p>
  <div class="chips">${CARTOES.map((c, i) => `<label class="chip"><input type="checkbox" class="impc" value="${i}" checked style="accent-color:var(--pri)"> ${c.emoji} ${c.cat}</label>`).join("")}</div></div>
  <div class="tip small">💡 <b>Ideias:</b> imprima 2 vezes e faça um jogo da memória; espalhe pela casa para uma caça aos cartões; coloque na geladeira as palavras da semana.</div>
  <button class="btn" id="gerimp">🖨️ Gerar PDF dos cartões</button>`;
  $("#gerimp").onclick = () => {
    const sel = [...document.querySelectorAll(".impc:checked")].map((x) => +x.value); if (!sel.length) return toast("Escolha pelo menos uma categoria");
    toast("Gerando… aguarde"); setTimeout(() => gerarCartoes(sel), 50);
  };
};
function gerarCartoes(sel) {
  const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: "mm", format: "a4" });
  const itens = sel.flatMap((i) => CARTOES[i].itens.map((x) => ({ x, cat: CARTOES[i].cat })));
  const cw = 85, ch = 85, gx = 12, gy = 8, mx = (210 - cw * 2 - gx) / 2, my = 14;
  const cv = document.createElement("canvas"); cv.width = 600; cv.height = 600; const ctx = cv.getContext("2d");
  itens.forEach((it, k) => {
    if (k && k % 6 === 0) doc.addPage();
    const pos = k % 6, col = pos % 2, row = Math.floor(pos / 2);
    ctx.clearRect(0, 0, 600, 600); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 600, 600);
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = "300px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif"; ctx.fillText(it.x[0], 300, 250);
    ctx.font = "900 64px Nunito, sans-serif"; ctx.fillStyle = "#2d2118"; ctx.fillText(it.x[1].toUpperCase(), 300, 500);
    const x = mx + col * (cw + gx), y = my + row * (ch + gy);
    doc.setDrawColor(242, 107, 58); doc.setLineWidth(0.8); doc.setLineDashPattern([2, 2], 0); doc.roundedRect(x, y, cw, ch, 6, 6);
    doc.addImage(cv.toDataURL("image/jpeg", 0.85), "JPEG", x + 4, y + 4, cw - 8, ch - 8);
  });
  doc.save("cartoes-fala-em-casa.pdf"); toast("PDF dos cartões pronto! 🖨️");
}

// ---------- MAIS ----------
R.mais = () => {
  $("#maisbox").innerHTML = `<h2>Mais</h2>
  <div class="card gap"><h3>👶 ${esc(nome())}</h3><p class="small muted">${idadeTxt()} · Fase ${fase().id}: ${fase().nome}</p>
    <button class="btn sec" onclick="refazer()">🔄 Refazer a avaliação</button></div>
  <button class="listm" onclick="go('marcos')"><span class="d" style="background:var(--teal-l);font-size:22px">✅</span><div style="flex:1"><b>Marcos da fala</b></div>${COMPLETO ? "›" : "🔒"}</button>
  <button class="listm" onclick="go('guias')"><span class="d" style="background:var(--teal-l);font-size:22px">📚</span><div style="flex:1"><b>Guias para pais</b></div>${COMPLETO ? "›" : "🔒"}</button>
  <button class="listm" onclick="go('rel')"><span class="d" style="background:var(--teal-l);font-size:22px">📄</span><div style="flex:1"><b>Relatório em PDF</b></div>${COMPLETO ? "›" : "🔒"}</button>
  <button class="listm" onclick="go('imp')"><span class="d" style="background:var(--teal-l);font-size:22px">🖨️</span><div style="flex:1"><b>Cartões para imprimir</b></div>${COMPLETO ? "›" : "🔒"}</button>
  <div class="card gap"><h3>🔑 Seu acesso</h3><p class="small">${COMPLETO ? "<b>Plano Completo</b>" : "<b>Plano Básico</b>"}${S.acesso?.email ? " · " + esc(S.acesso.email) : ""}</p></div>
  <div class="card gap"><h3>📲 Deixe o app na tela do celular</h3><p class="small"><b>iPhone:</b> no Safari, toque em Compartilhar e depois em “Adicionar à Tela de Início”.<br><b>Android:</b> no Chrome, toque nos 3 pontinhos e em “Adicionar à tela inicial”.</p>
    <p class="small muted">Seus dados ficam salvos neste aparelho. Use sempre o mesmo celular e navegador.</p></div>
  ${COMPLETO ? "" : upgBox()}
  <button class="btn sec" onclick="apagar()" style="color:#c0392b">Apagar todos os dados</button>
  <p class="disc">Fala em Casa é um apoio para a família estimular a fala em casa. Não faz diagnóstico e não substitui avaliação ou terapia com fonoaudiólogo.</p>`;
};
function refazer() { if (!confirm("Refazer a avaliação? As palavras do diário e os marcos continuam salvos.")) return; S.resp = {}; stack = []; go("quiz"); }
function apagar() { if (!confirm("Apagar TODOS os dados deste aparelho? Isso não pode ser desfeito.")) return; const a = S.acesso; localStorage.removeItem(KEY); S = a ? { acesso: a } : {}; save(); stack = []; go(a ? "quiz" : "acesso"); }

// ---------- acesso pelo e-mail da compra ----------
async function consultaAcesso(email) {
  const r = await fetch(ACESSO_API + encodeURIComponent(email), { cache: "no-store" });
  return (await r.json()).tier || null;
}
function aplicaAcesso(email, tier) {
  S.acesso = { email, tier, em: hoje() }; COMPLETO = TIER === "completo" || tier === "completo"; save();
}
R.acesso = () => {
  $("#acessobox").innerHTML = `<div class="logo"><b>🗣️</b>Fala em Casa</div>
  <div class="card gap" style="text-align:center"><div style="font-size:54px">👋</div><h1>Bem-vinda!</h1>
    <p>Para liberar o seu app, digite o <b>e-mail ou o telefone (com DDD)</b> que você usou na compra.</p>
    <input class="field" id="em" type="text" autocomplete="email" autocapitalize="none" placeholder="e-mail ou telefone com DDD" value="${esc(S.acesso?.email || "")}">
    <button class="btn" id="emok">Liberar meu acesso</button>
    <p class="small muted" id="emmsg"></p></div>
  <p class="disc">Pagou por PIX agora? A liberação pode levar até 2 minutos depois do pagamento.</p>`;
  const go_ = async () => {
    const email = $("#em").value.trim().toLowerCase(), msg = $("#emmsg");
    const ok = email.includes("@") ? /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) : email.replace(/\D/g, "").length >= 10;
    if (!ok) { msg.textContent = "Digite o e-mail ou o telefone com DDD (ex.: 11 98765-4321)."; return; }
    $("#emok").disabled = true; msg.textContent = "Verificando sua compra…";
    try {
      const tier = await consultaAcesso(email);
      if (!tier) { msg.innerHTML = "Não encontramos uma compra aprovada com esse dado. Confira se é o mesmo e-mail ou telefone do pagamento, ou tente pelo outro."; $("#emok").disabled = false; return; }
      aplicaAcesso(email, tier); toast(tier === "completo" ? "Plano Completo liberado! 🎉" : "Acesso liberado! 🎉");
      stack = []; if (S.fase && S.perfil?.nome) go("home", false); else go("quiz", false);
    } catch (e) { msg.textContent = "Sem conexão. Verifique a internet e tente de novo."; $("#emok").disabled = false; }
  };
  $("#emok").onclick = go_; $("#em").onkeydown = (e) => e.key === "Enter" && go_();
};
async function liberar(btn) {
  const email = S.acesso?.email; if (!email) { go("acesso"); return; }
  btn.disabled = true; btn.textContent = "Verificando…";
  try {
    const tier = await consultaAcesso(email);
    if (tier === "completo") { aplicaAcesso(email, tier); toast("Plano Completo liberado! 🎉"); const cur = document.querySelector(".screen.on").id.slice(2); go(cur, false); return; }
    toast("Ainda não encontramos o upgrade. Se acabou de pagar, aguarde 1 minuto.");
  } catch (e) { toast("Sem conexão. Tente de novo."); }
  btn.disabled = false; btn.textContent = "Já comprei: liberar o Completo";
}

// ---------- início ----------
if (TIER !== "completo" && !S.acesso?.tier) go("acesso", false);
else if (S.fase && S.perfil?.nome) go("home", false); else go("quiz", false);
// quem está no básico: confere em silêncio se já fez o upgrade
if (TIER !== "completo" && S.acesso?.tier === "basico") consultaAcesso(S.acesso.email).then((t) => { if (t === "completo") { aplicaAcesso(S.acesso.email, t); toast("Plano Completo liberado! 🎉"); const cur = document.querySelector(".screen.on").id.slice(2); go(cur, false); } }).catch(() => {});
</script>
