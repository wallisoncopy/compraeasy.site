<meta http-equiv="refresh" content="0; url=/appfono-es/?utm_source=instagram&amp;utm_medium=organico&amp;utm_content=dm-fono-es">
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var dest = new URLSearchParams({ utm_source: "instagram", utm_medium: "organico", utm_content: "dm-fono-es" });
    p.forEach(function (v, k) { dest.set(k, v); }); // ?utm_content=... no atalho sobrepõe o padrão
    location.replace("/appfono-es/?" + dest.toString());
  })();
</script>
